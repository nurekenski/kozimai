function wrapLines(g, text, maxW){
  var words = String(text).split(/\s+/), lines = [], cur = '';
  words.forEach(function(w){
    var test = cur ? cur + ' ' + w : w;
    if (g.measureText(test).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  return lines;
}
function roundRect(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y, x+w, y+h, r);
  g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r);
  g.arcTo(x, y, x+w, y, r);
  g.closePath();
}

// Draws the patient's 3x4 photo (cover-fit, rounded corners) on the report canvas.
function drawPhotoBox(g, x, y, w, h, img, r){
  roundRect(g, x, y, w, h, r);
  if (img){
    g.save();
    g.clip();
    var ir = img.width / img.height, br = w / h, sw, sh, sx, sy;
    if (ir > br){ sh = img.height; sw = sh*br; sx = (img.width-sw)/2; sy = 0; }
    else { sw = img.width; sh = sw/br; sx = 0; sy = (img.height-sh)/2; }
    g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    g.restore();
  } else {
    g.fillStyle = '#f2f4f7'; g.fill();
  }
  g.strokeStyle = '#e4e8ee'; g.lineWidth = 2; roundRect(g, x, y, w, h, r); g.stroke();
}

// "Ескерту!" box for the report sheet. Returns the y position below the box.
function drawWarnBox(g, F, M, y, CWID, risk){
  var col = risk === 'high' ? ['#dc2626','#fdecec'] : ['#b45309','#fff7e6'];
  var INK = '#0f2138', MUTED = '#5b6b80';
  var tx = M + 40, inner = CWID - 40 - 34;
  g.font = '700 27px ' + F;
  var lead = wrapLines(g, warnLead(risk), inner);
  g.font = '500 23px ' + F;
  var txt = wrapLines(g, warnText(risk), inner);
  g.font = '700 22px ' + F;
  var subT = wrapLines(g, T('warnUrgentTitle'), inner);
  g.font = '500 22px ' + F;
  var bullets = T('warnUrgent').map(function(t){ return wrapLines(g, t, inner - 30); });
  var bulletLines = bullets.reduce(function(n, b){ return n + b.length; }, 0);

  var h = 28 + 46 + 16 + lead.length*38 + 8 + txt.length*35 + 22 + subT.length*32 + 8 + bulletLines*31 + bullets.length*4 + 26;

  g.fillStyle = col[1]; roundRect(g, M, y, CWID, h, 24); g.fill();
  g.save(); roundRect(g, M, y, CWID, h, 24); g.clip(); g.fillStyle = col[0]; g.fillRect(M, y, 12, h); g.restore();

  // warning triangle + title
  var ix = tx, iy = y + 28, sz = 40;
  g.lineJoin = 'round'; g.lineWidth = 6; g.strokeStyle = col[0]; g.fillStyle = col[0];
  g.beginPath(); g.moveTo(ix + sz/2, iy + 2); g.lineTo(ix + sz - 2, iy + sz - 4); g.lineTo(ix + 2, iy + sz - 4); g.closePath();
  g.stroke(); g.fill();
  g.fillStyle = '#ffffff'; g.font = '800 24px ' + F; g.textAlign = 'center';
  g.fillText('!', ix + sz/2, iy + sz - 9);
  g.textAlign = 'left';
  g.fillStyle = col[0]; g.font = '800 36px ' + F;
  g.fillText(T('warnTitle'), ix + sz + 16, iy + 33);

  var cy = y + 28 + 46 + 16;
  g.fillStyle = INK; g.font = '700 27px ' + F;
  lead.forEach(function(ln){ cy += 30; g.fillText(ln, tx, cy); cy += 8; });
  cy += 8;
  g.fillStyle = INK; g.font = '500 23px ' + F;
  txt.forEach(function(ln){ cy += 26; g.fillText(ln, tx, cy); cy += 9; });
  cy += 22;
  g.fillStyle = INK; g.font = '700 22px ' + F;
  subT.forEach(function(ln){ cy += 22; g.fillText(ln, tx, cy); cy += 10; });
  cy += 8;
  bullets.forEach(function(lines){
    g.fillStyle = col[0]; g.beginPath(); g.arc(tx + 8, cy + 17, 5, 0, Math.PI*2); g.fill();
    g.fillStyle = MUTED; g.font = '500 22px ' + F;
    lines.forEach(function(ln){ cy += 22; g.fillText(ln, tx + 30, cy); cy += 9; });
    cy += 4;
  });
  return y + h;
}

// The report is drawn on a canvas (A4 @150 dpi) so Kazakh/Russian letters render
// correctly; jsPDF's built-in fonts cannot draw Cyrillic.
// paintReport() draws on a canvas of height H and also returns where the content ended.
function paintReport(H){
  var W = 1240, M = 90, CWID = W - 2*M;
  var c = document.createElement('canvas'); c.width = W; c.height = H;
  var g = c.getContext('2d');
  var F = "'Inter','Segoe UI',Roboto,Arial,sans-serif";
  var INK = '#0f2138', MUTED = '#5b6b80', LINE = '#e4e8ee', BLUE = '#0a7ee0';
  var RISK = { low:['#16a34a','#eafaf0'], medium:['#b45309','#fff7e6'], high:['#dc2626','#fdecec'] };
  g.textBaseline = 'alphabetic';
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, W, H);
  g.fillStyle = BLUE; g.fillRect(0, 0, W, 14);

  // logo
  g.save(); g.translate(M, 62); g.scale(1.25, 1.25);
  g.fillStyle = BLUE; g.fill(new Path2D('M2 32C10 15 22 6 32 6c10 0 22 9 30 26-8 17-20 26-30 26C22 58 10 49 2 32Z'));
  g.fillStyle = '#fff'; g.beginPath(); g.arc(32,32,15,0,Math.PI*2); g.fill();
  g.fillStyle = INK; g.beginPath(); g.arc(32,32,9.5,0,Math.PI*2); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(36.5,27.5,3,0,Math.PI*2); g.fill();
  g.restore();
  g.fillStyle = INK; g.font = '800 46px ' + F; g.fillText('KozimAI Vision', M+98, 108);
  g.fillStyle = MUTED; g.font = '500 24px ' + F; g.fillText(T('report'), M+98, 144);

  var y = 220;
  g.fillStyle = LINE; g.fillRect(M, y-34, CWID, 2);
  var pt = state.patient, now = new Date();
  if (pt){
    if (pt.photo && reportPhotoImg){
      var photoW = 168, photoH = 224;
      drawPhotoBox(g, M+CWID-photoW, y-34, photoW, photoH, reportPhotoImg, 14);
    }
    var age = ageOf(pt.birth), reg = new Date(pt.registeredAt);
    g.fillStyle = INK; g.font = '800 36px ' + F; g.fillText(fullName(pt), M, y+6); y += 52;
    g.fillStyle = MUTED; g.font = '600 23px ' + F;
    [
      T('iin') + ': ' + pt.iin,
      T('phone') + ': ' + (pt.phone || '—'),
      T('birthDate') + ': ' + birthText(pt.birth) + ' (' + age + ' ' + T('ageYears') + ' · ' + ageCategoryLabel(age) + ')',
      T('registeredAt') + ': ' + fmtDMY(reg) + ', ' + fmtHMS(reg),
      T('reportDate') + ': ' + fmtDate(now) + ', ' + fmtHMS(now)
    ].forEach(function(line){ g.fillText(line, M, y); y += 34; });
    y += 18;
  }
  // overall
  var risk = combinedRisk();
  g.font = '500 25px ' + F;
  var lines = wrapLines(g, riskMsg(risk), CWID - 64);
  var boxH = 40 + 44 + 20 + lines.length*38 + 26;
  g.fillStyle = RISK[risk][1]; roundRect(g, M, y, CWID, boxH, 24); g.fill();
  g.fillStyle = MUTED; g.font = '600 22px ' + F; g.fillText(T('overallResult'), M+32, y+46);
  g.fillStyle = RISK[risk][0]; g.font = '800 38px ' + F; g.fillText(riskLabel(risk), M+32, y+96);
  g.fillStyle = INK; g.font = '500 25px ' + F;
  lines.forEach(function(ln, i){ g.fillText(ln, M+32, y+144+i*38); });
  y += boxH + 32;

  // warning: see an ophthalmologist
  y = drawWarnBox(g, F, M, y, CWID, risk) + 58;

  // per-eye table
  var r = state.rightResult, l = state.leftResult;
  var c1 = M + 470, c2 = M + 790;
  g.fillStyle = INK; g.font = '700 26px ' + F;
  g.fillText(T('rightEye'), c1, y); g.fillText(T('leftEye'), c2, y);
  y += 22;
  var rows = [
    [T('acuityShort'), Math.round(r.acuityIndex)+'%', Math.round(l.acuityIndex)+'%'],
    [T('quality'), Math.round(r.quality)+'%', Math.round(l.quality)+'%'],
    [T('responseTime'), Math.round(r.avgResponseTime)+' ms', Math.round(l.avgResponseTime)+' ms'],
    [T('missCount'), String(r.missCount), String(l.missCount)],
    [T('trialsCount'), String(r.totalResponses), String(l.totalResponses)],
    [T('riskLevel'), riskLabel(r.risk), riskLabel(l.risk), r.risk, l.risk]
  ];
  rows.forEach(function(row, i){
    var rowH = 56;
    if (i % 2 === 0){ g.fillStyle = '#f7f9fb'; roundRect(g, M, y, CWID, rowH, 14); g.fill(); }
    g.font = '500 24px ' + F; g.fillStyle = MUTED; g.fillText(row[0], M+24, y+38);
    g.font = '700 25px ' + F;
    g.fillStyle = row[3] ? RISK[row[3]][0] : INK; g.fillText(row[1], c1, y+38);
    g.fillStyle = row[4] ? RISK[row[4]][0] : INK; g.fillText(row[2], c2, y+38);
    y += rowH;
  });
  y += 40;

  // notes
  g.font = '500 22px ' + F; g.fillStyle = MUTED;
  resultNotes().forEach(function(t){
    var ls = wrapLines(g, t, CWID - 36);
    g.fillStyle = BLUE; g.beginPath(); g.arc(M+8, y-7, 5, 0, Math.PI*2); g.fill();
    g.fillStyle = MUTED;
    ls.forEach(function(ln, i){ g.fillText(ln, M+36, y + i*32); });
    y += ls.length*32 + 14;
  });
  var endY = y;

  // disclaimer at the bottom
  g.font = '500 22px ' + F;
  var dl = wrapLines(g, T('pdfDisclaimer'), CWID - 64);
  var dH = 40 + dl.length*32;
  var dy = H - 130 - dH;
  g.fillStyle = '#e6f3fd'; roundRect(g, M, dy, CWID, dH, 20); g.fill();
  g.fillStyle = '#0b4c7c';
  dl.forEach(function(ln, i){ g.fillText(ln, M+32, dy+42+i*32); });
  g.fillStyle = MUTED; g.font = '500 20px ' + F;
  g.fillText('KozimAI Vision © ' + now.getFullYear() + ' · ' + T('allRightsReserved'), M, H-60);
  return { canvas: c, endY: endY, footH: dH };
}

// Normally one A4 page (1754 px high). If the content is longer (extra notes), the sheet grows a little and is
// scaled to fit the page, so nothing is cut off or overlaps.
function drawReport(){
  var A4H = 1754;
  var probe = paintReport(3400);
  var need = Math.max(A4H, Math.ceil(probe.endY + 36 + probe.footH + 130));
  return paintReport(need).canvas;
}

function canvasToBlob(canvas, type, q){
  return new Promise(function(resolve, reject){
    if (canvas.toBlob) canvas.toBlob(function(b){ b ? resolve(b) : reject(new Error('toBlob failed')); }, type, q);
    else reject(new Error('toBlob unsupported'));
  });
}

function reportName(ext){
  var n = new Date();
  return 'kozimai-vision-report-' + n.getFullYear() + pad2(n.getMonth()+1) + pad2(n.getDate()) + '-' + pad2(n.getHours()) + pad2(n.getMinutes()) + '.' + ext;
}
function buildReportFile(canvas){
  var ctor = window.jspdf && window.jspdf.jsPDF;
  if (ctor){
    var doc = new ctor({ orientation:'p', unit:'mm', format:'a4', compress:true });
    var iw = 210, ih = 210 * canvas.height / canvas.width, ix = 0;
    if (ih > 297){ ih = 297; iw = 297 * canvas.width / canvas.height; ix = (210 - iw) / 2; }   // taller than A4: scale to fit
    doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', ix, 0, iw, ih);
    return Promise.resolve({ blob: doc.output('blob'), name: reportName('pdf') });
  }
  // jsPDF failed to load (offline / blocked CDN): deliver the same report as an image
  return canvasToBlob(canvas, 'image/png').then(function(b){ return { blob: b, name: reportName('png') }; });
}

function saveBlob(blob, filename){
  return new Promise(function(resolve, reject){
    function viaLink(){
      try {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; a.style.display = 'none';
        document.body.appendChild(a); a.click();
        setTimeout(function(){ URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 4000);
        resolve('saved');
      } catch(e){ reject(e); }
    }
    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('downloads').then(function(dl){
        if (!dl){ viaLink(); return; }
        dl.save({ filename: filename, data: blob }).then(
          function(){ resolve('saved'); },
          function(err){ if (err && err.code === 'declined') resolve('declined'); else reject(err); }
        );
      }, viaLink);
    } else {
      viaLink();
    }
  });
}

function generateAndSavePDF(){
  if (!hasResults() || state.pdfBusy) return;
  setPdfBusy(true);
  loadReportFonts()
    .then(function(){ return loadReportPhoto(); })
    .then(function(img){ reportPhotoImg = img; return buildReportFile(drawReport()); })
    .then(function(f){ return saveBlob(f.blob, f.name); })
    .then(function(res){ if (res !== 'declined') toast(T('saved')); })
    .catch(function(e){ if (window.console) console.error(e); toast(T('saveFailed'), 'error'); })
    .then(function(){ setPdfBusy(false); });
}

/* ---------------- Registry storage ---------------- */
var REG_KEY = 'kozimai-registry-v1';

function validRecord(r){
  return r && typeof r === 'object' && /^\d{12}$/.test(String(r.iin)) && typeof r.surname === 'string' && typeof r.name === 'string' &&
    r.birth && +r.birth.y > 1800 && +r.birth.m >= 1 && +r.birth.m <= 12 && +r.birth.d >= 1 && typeof r.registeredAt === 'string';
}
function loadRegistry(){
  try {
    var raw = window.localStorage.getItem(REG_KEY);
    state.storageOk = true;
    if (!raw) return [];
    var arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr.filter(validRecord) : [];
  } catch(e){
    state.storageOk = false;
    return [];
  }
}
function saveRegistry(){
  try {
    window.localStorage.setItem(REG_KEY, JSON.stringify(state.registry));
    state.storageOk = true;
    autoSyncFolder();
    return true;
  } catch(e){
    state.storageOk = false;
    return false;
  }
}

/* ---------------- Local folder sync (File System Access API) ---------------- */
// Lets the person pick a real folder on their computer. Every time the registry changes we
// write each patient's data (and photo) as files there, plus one always-current Excel file.
// Supported in Chromium browsers only (Chrome, Edge); other browsers keep using the
// Excel download/upload buttons as their "single place" for the data.
var FS_DB = 'kozimai-fs-v1', FS_STORE = 'handles', FS_KEY = 'folder';
var fsDirHandle = null;

function fsSupported(){ return !!(window.showDirectoryPicker && window.indexedDB); }

function fsIdbOpen(){
  return new Promise(function(resolve, reject){
    var req = indexedDB.open(FS_DB, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(FS_STORE); };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function fsIdbSet(handle){
  return fsIdbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FS_STORE, 'readwrite');
      tx.objectStore(FS_STORE).put(handle, FS_KEY);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
  });
}
function fsIdbGet(){
  return fsIdbOpen().then(function(db){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(FS_STORE, 'readonly');
      var req = tx.objectStore(FS_STORE).get(FS_KEY);
      req.onsuccess = function(){ resolve(req.result || null); };
      req.onerror = function(){ reject(req.error); };
    });
  });
}
function fsIdbClear(){
  return fsIdbOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(FS_STORE, 'readwrite');
      tx.objectStore(FS_STORE).delete(FS_KEY);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  });
}

// Lets the person choose a folder for the first time (must run inside a click handler).
var fsLastCanceled = false;
function connectFolder(){
  fsLastCanceled = false;
  if (!fsSupported()) return Promise.resolve(false);
  return window.showDirectoryPicker({ mode: 'readwrite' }).then(function(handle){
    return handle.requestPermission({ mode: 'readwrite' }).then(function(p){
      if (p !== 'granted') return false;
      fsDirHandle = handle;
      state.folderName = handle.name;
      state.folderReady = true;
      return fsIdbSet(handle).then(function(){ return true; });
    });
  }).catch(function(err){
    if (err && err.name === 'AbortError'){ fsLastCanceled = true; return false; }
    if (window.console) console.error(err);
    return false;
  });
}
function disconnectFolder(){
  fsDirHandle = null;
  state.folderName = ""; state.folderReady = false;
  return fsIdbClear();
}
// Re-grants access to a previously chosen folder (must also run inside a click handler).
function ensureFolderPermission(){
  if (!fsDirHandle) return Promise.resolve(false);
  return fsDirHandle.requestPermission({ mode: 'readwrite' }).then(function(p){
    state.folderReady = (p === 'granted');
    return state.folderReady;
  }).catch(function(){ return false; });
}
// On page load: reconnects silently if the browser already remembers granting access;
// otherwise just remembers the folder's name so the UI can offer a one-click "reconnect".
function tryRestoreFolder(){
  if (!fsSupported()) return Promise.resolve();
  return fsIdbGet().then(function(handle){
    if (!handle) return;
    fsDirHandle = handle;
    state.folderName = handle.name;
    return handle.queryPermission({ mode: 'readwrite' }).then(function(p){
      state.folderReady = (p === 'granted');
    });
  }).catch(function(){});
}

function fsWriteFile(dirHandle, name, blob){
  return dirHandle.getFileHandle(name, { create: true }).then(function(fh){
    return fh.createWritable().then(function(w){ return w.write(blob).then(function(){ return w.close(); }); });
  });
}
function dataUrlToBlob(dataUrl){
  var parts = dataUrl.split(','), mime = (parts[0].match(/:(.*?);/) || [null,'image/jpeg'])[1];
  var bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for (var i=0; i<bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
function safeFileName(s){
  return String(s).replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').trim() || 'patient';
}
function patientFileBase(rec){
  return safeFileName(rec.iin + '_' + rec.surname + '_' + rec.name);
}
function syncPatientToFolder(rec){
  var base = patientFileBase(rec), tasks = [];
  tasks.push(fsDirHandle.getDirectoryHandle('patients', { create: true }).then(function(dir){
    var data = {
      surname: rec.surname, name: rec.name, iin: rec.iin, phone: rec.phone,
      birth: rec.birth, registeredAt: rec.registeredAt, result: rec.result || null
    };
    return fsWriteFile(dir, base + '.json', new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  }));
  if (rec.photo){
    tasks.push(fsDirHandle.getDirectoryHandle('photos', { create: true }).then(function(dir){
      return fsWriteFile(dir, base + '.jpg', dataUrlToBlob(rec.photo));
    }));
  }
  return Promise.all(tasks);
}
// Writes every patient's json/photo plus one always-current Excel file into the folder.
function syncAllToFolder(silent){
  if (!fsDirHandle) return Promise.resolve(false);
  return ensureFolderPermission().then(function(ok){
    if (!ok){ if (!silent) toast(T('folderPermDenied'), 'error'); return false; }
    var jobs = state.registry.map(function(r){ return syncPatientToFolder(r); });
    jobs.push(buildWorkbookBlob().then(function(blob){
      return fsWriteFile(fsDirHandle, 'kozimai-patients.xlsx', blob);
    }).catch(function(){}));
    return Promise.all(jobs).then(function(){ if (!silent) toast(T('folderSynced')); return true; })
      .catch(function(e){ if (window.console) console.error(e); if (!silent) toast(T('folderSyncFail'), 'error'); return false; });
  });
}
var autoSyncTimer = null;
function autoSyncFolder(){
  if (!fsDirHandle || !state.folderReady) return;
  clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(function(){ syncAllToFolder(true).catch(function(){}); }, 600);
}

var XL_HEAD = ['№','Тегі','Есімі','ЖСН','Телефон','Логин','Құпия сөз','Туған күні','Жасы','Тіркелген күні','Тіркелген уақыты','Оң көз көрсеткіші, %','Сол көз көрсеткіші, %','Қауіп деңгейі','Тест күні','Тест уақыты'];
var XL_ALIASES = {
  'жсн':'iin', 'телефон':'phone', 'тегі':'surname', 'есімі':'name', 'туған күні':'birth',
  'логин':'login', 'құпия сөз':'password',
  'тіркелген күні':'regDate', 'тіркелген уақыты':'regTime',

var XL_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

function excelName(){

function buildWorkbookBlob(){
  if (!window.ExcelJS) return Promise.reject(new Error('ExcelJS missing'));
  try {
    var wb = new ExcelJS.Workbook();
    wb.creator = 'KozimAI Vision'; wb.created = new Date();
    var ws = wb.addWorksheet(T('sheetName'), {
      views: [{ state:'frozen', ySplit:1 }],
      properties: { tabColor: { argb:'FF0A7EE0' } }
    });
    var widths = [6,20,18,16,19,16,16,14,8,16,17,21,21,18,14,14];
    ws.columns = XL_HEAD.map(function(h,i){ return { header:h, key:'c'+i, width:widths[i] }; });

    var thin = { style:'thin', color:{ argb:'FFDDE3EA' } };
    var border = { top:thin, left:thin, bottom:thin, right:thin };
    var head = ws.getRow(1);
    head.height = 32;
    head.eachCell(function(c){
      c.font = { bold:true, color:{ argb:'FFFFFFFF' }, size:11, name:'Calibri' };
      c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FF0A7EE0' } };
      c.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
      c.border = border;
    });

    var RISK_STYLE = {
      low:    { fg:'FF15803D', bg:'FFEAFAF0' },
      medium: { fg:'FFB45309', bg:'FFFFF7E6' },
      high:   { fg:'FFDC2626', bg:'FFFDECEC' }
    };
    var list = state.registry.slice().sort(function(a,b){ return a.registeredAt < b.registeredAt ? -1 : a.registeredAt > b.registeredAt ? 1 : 0; });
    list.forEach(function(r, idx){
      var reg = new Date(r.registeredAt), res = r.result;
      var tested = res && res.testedAt ? new Date(res.testedAt) : null;
      var row = ws.addRow([
        idx+1, r.surname, r.name, String(r.iin), r.phone || '', String(r.iin), r.password || '',
        birthText(r.birth), ageOf(r.birth),
        fmtDMY(reg), fmtHMS(reg),
        res && res.right ? Math.round(res.right.acuityIndex) : null,
        res && res.left ? Math.round(res.left.acuityIndex) : null,
        res ? riskLabel(res.risk) : '',
        tested ? fmtDMY(tested) : '', tested ? fmtHMS(tested) : ''
      ]);
      row.height = 22;
      row.eachCell({ includeEmpty:true }, function(c, col){
        c.border = border;
        c.font = { name:'Calibri', size:11, color:{ argb:'FF0F2138' } };
        c.alignment = { vertical:'middle', horizontal: (col === 2 || col === 3) ? 'left' : 'center' };
        if (idx % 2 === 1) c.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:'FFF7F9FB' } };
      });
      row.getCell(4).numFmt = '@';     // IIN stays text: leading zeros must survive
      row.getCell(5).numFmt = '@';     // phone stays text: keeps the leading +
      row.getCell(6).numFmt = '@';     // login (= IIN) stays text: leading zeros must survive
      row.getCell(7).numFmt = '@';     // password stays text: any leading zeros/characters survive
      if (res && RISK_STYLE[res.risk]){
        var rc = row.getCell(14), st = RISK_STYLE[res.risk];
        rc.font = { name:'Calibri', size:11, bold:true, color:{ argb:st.fg } };
        rc.fill = { type:'pattern', pattern:'solid', fgColor:{ argb:st.bg } };
      }
    });
    ws.autoFilter = { from:{ row:1, column:1 }, to:{ row:1, column:XL_HEAD.length } };
    ws.pageSetup = { orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 };

    var info = wb.addWorksheet(T('infoSheet'), { properties: { tabColor: { argb:'FF64748B' } } });
    info.columns = [{ width:34 }, { width:60 }];
    var now = new Date();
    info.addRow([T('infoTitle')]);
    info.getRow(1).font = { bold:true, size:14, color:{ argb:'FF0A7EE0' }, name:'Calibri' };
    info.addRow([]);
    info.addRow([T('infoExported'), fmtDMY(now) + ', ' + fmtHMS(now)]);
    info.addRow([T('infoCount'), state.registry.length]);
    info.addRow([]);
    info.addRow([T('infoNote')]);
    info.getCell('B4').alignment = { horizontal:'left' };
    info.getRow(3).getCell(1).font = { bold:true, name:'Calibri' };
    info.getRow(4).getCell(1).font = { bold:true, name:'Calibri' };

    return wb.xlsx.writeBuffer().then(function(buf){ return new Blob([buf], { type: XL_MIME }); });
  } catch(e){
    return Promise.reject(e);
  }
}

function exportXlsx(){

/* ---------------- Excel import ---------------- */
function plainVal(v){
  if (v === null || v === undefined) return '';
  if (v instanceof Date) return v;
  if (typeof v === 'object'){
    if (v.richText) return v.richText.map(function(t){ return t.text; }).join('');
    if (v.result !== undefined) return plainVal(v.result);
    if (v.text !== undefined) return plainVal(v.text);
    return '';
  }
  return v;
}
function parseDateVal(v){
  if (v instanceof Date && !isNaN(v)) return { y:v.getUTCFullYear(), m:v.getUTCMonth()+1, d:v.getUTCDate() };
  var t = String(v === null || v === undefined ? '' : v).trim(), a;
  if ((a = t.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/))) return { d:+a[1], m:+a[2], y:+a[3] };
  if ((a = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return { y:+a[1], m:+a[2], d:+a[3] };
  return null;
}
function parseTimeVal(v){
  if (v instanceof Date && !isNaN(v)) return { h:v.getUTCHours(), mi:v.getUTCMinutes(), s:v.getUTCSeconds() };
  var a = String(v === null || v === undefined ? '' : v).trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  return a ? { h:+a[1], mi:+a[2], s:+(a[3] || 0) } : null;
}
function dateTimeFrom(dv, tv){
  var d = parseDateVal(dv);
  if (!d) return null;
  var t = parseTimeVal(tv) || { h:0, mi:0, s:0 };
  var dt = new Date(d.y, d.m-1, d.d, t.h, t.mi, t.s);
  return isNaN(dt) ? null : dt;
}
function riskFromIndex(x){ return x >= 70 ? 'low' : (x >= 40 ? 'medium' : 'high'); }
function riskFromLabel(t){
  t = String(t || '').trim().toLowerCase();
  if (t === T('riskLow').toLowerCase()) return 'low';
  if (t === T('riskMed').toLowerCase()) return 'medium';
  if (t === T('riskHigh').toLowerCase()) return 'high';
  return null;
}
function numOrNull(v){
  if (v === '' || v === null || v === undefined) return null;
  var n = parseFloat(String(v).replace(',','.'));
  return isFinite(n) && n >= 0 && n <= 100 ? n : null;
}

function importXlsxFile(file){
  if (!window.ExcelJS){ toast(T('xlsLibFail'), 'error'); return; }
  if (file.size > 8*1024*1024){ toast(T('xlsTooBig'), 'error'); return; }
  var read = file.arrayBuffer ? file.arrayBuffer() : new Promise(function(res, rej){
    var fr = new FileReader(); fr.onload = function(){ res(fr.result); }; fr.onerror = rej; fr.readAsArrayBuffer(file);
  });
  read.then(function(buf){
    var wb = new ExcelJS.Workbook();
    return wb.xlsx.load(buf).then(function(){ return wb; });
  }).then(function(wb){
    var ws = wb.getWorksheet(T('sheetName')) || wb.worksheets[0];
    if (!ws) throw new Error('no sheet');
    var map = {};
    ws.getRow(1).eachCell(function(cell, col){
      var h = String(plainVal(cell.value)).trim().toLowerCase().replace(/\s+/g,' ');
      if (XL_ALIASES[h]) map[XL_ALIASES[h]] = col;
    });
    if (!map.iin || !map.surname || !map.name || !map.birth){
      infoDialog(T('xlsDone'), [T('xlsNoHeaders')]);
      return;
    }
    var seen = {}, i;
    state.registry.forEach(function(r){ seen[r.iin] = true; });
    var added = [], dups = 0, errs = [];
    function cellVal(row, key){ return map[key] ? plainVal(row.getCell(map[key]).value) : ''; }

    ws.eachRow(function(row, n){
      if (n === 1) return;
      var rawIin = cellVal(row, 'iin'), sur = String(cellVal(row, 'surname')).trim(), nam = String(cellVal(row, 'name')).trim();
      var rawBirth = cellVal(row, 'birth');
      if (rawIin === '' && sur === '' && nam === '' && rawBirth === '') return;   // blank line
      var where = TF('rowLabel', { n:n }) + ': ';
      var iin = String(rawIin).replace(/\s+/g,'');
      if (/^\d{11}$/.test(iin)) iin = '0' + iin;                  // number cell that lost its leading zero
      if (!/^\d{12}$/.test(iin)){ errs.push(where + T('rowErrIin')); return; }
      if (!nameOk(sur) || !nameOk(nam)){ errs.push(where + T('rowErrName')); return; }
      var b = parseDateVal(rawBirth);
      if (!b || birthStatusOf(b) === 'invalid' || birthStatusOf(b) === 'future'){ errs.push(where + T('rowErrBirth')); return; }
      var rawPhone = cellVal(row, 'phone'), phone = '';
      if (String(rawPhone).trim() !== ''){
        var pn = phoneNational(String(rawPhone));
        if (!phoneOk(pn)){ errs.push(where + T('rowErrPhone')); return; }
        phone = formatPhone(pn);
      }
      if (seen[iin]){ dups++; return; }
      seen[iin] = true;

      var reg = dateTimeFrom(cellVal(row, 'regDate'), cellVal(row, 'regTime')) || new Date();
      var rec = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        surname: normName(sur), name: normName(nam), iin: iin, phone: phone, birth: b,
        registeredAt: reg.toISOString(), result: null,
        password: String(cellVal(row, 'password') || '')
      };
      var ra = numOrNull(cellVal(row, 'right')), la = numOrNull(cellVal(row, 'left'));
      if (ra !== null || la !== null){
        var tested = dateTimeFrom(cellVal(row, 'testDate'), cellVal(row, 'testTime')) || reg;
        var rr = ra !== null ? riskFromIndex(ra) : null, lr = la !== null ? riskFromIndex(la) : null;
        var order = { low:0, medium:1, high:2 };
        var worst = (rr && lr) ? (order[rr] >= order[lr] ? rr : lr) : (rr || lr);
        rec.result = {
          partial: true, testedAt: tested.toISOString(), risk: riskFromLabel(cellVal(row, 'risk')) || worst,
          right: ra !== null ? { acuityIndex: ra, risk: rr } : null,
          left: la !== null ? { acuityIndex: la, risk: lr } : null
        };
      }
      added.push(rec);
    });

    if (added.length){
      state.registry = state.registry.concat(added);
      if (!saveRegistry()) toast(T('storageWarn'), 'error');
    }
    var lines = [];
    if (!added.length && !dups && !errs.length) lines.push(T('xlsNothing'));
    else {
      lines.push(TF('xlsAdded', { n: added.length }));
      if (dups) lines.push(TF('xlsDup', { n: dups }));
      if (errs.length){
        lines.push(TF('xlsErr', { n: errs.length }));
        errs.slice(0, 8).forEach(function(t){ lines.push('• ' + t); });
        if (errs.length > 8) lines.push('…');
      }
    }
    infoDialog(T('xlsDone'), lines);
    if (state.flow === 'registry') render();
  }).catch(function(e){
    if (window.console) console.error(e);
    toast(T('xlsReadFail'), 'error');
  });
}

/* ---------------- Registry screen ---------------- */
function deleteRecord(rec){
  state.registry = state.registry.filter(function(r){ return r !== rec; });
  saveRegistry();
  if (state.patient === rec){ state.patient = null; state.rightResult = null; state.leftResult = null; }
  toast(T('deleted'));
  render();
}

function renderRegistry(){
  var wrap = page();
  wrap.appendChild(topbar(false));
  var screen = el('div','screen');
  screen.style.alignItems = "flex-start";
  var card = el('div','card card-xl');

  var head = el('div','reg-head');
  var ht = el('div');
  ht.appendChild(el('h1',null, T('registryTitle')));
  ht.appendChild(el('p',null, TF('totalPatients', { n: state.registry.length })));
  head.appendChild(ht);
  // Admins don't register patients — patients self-register from the patient login/registration screen.
  card.appendChild(head);

  if (!state.storageOk) card.appendChild(el('div','msg msg-warn', T('storageWarn')));

  // local folder sync
  var folderRow = el('div','folder-row');
  function renderFolderRow(){
    folderRow.innerHTML = '';
    if (!fsSupported()){
      folderRow.appendChild(el('p','photo-hint', T('folderUnsupported')));
      return;
    }
    if (fsDirHandle && state.folderReady){
      var pill = el('div','folder-pill');
      pill.appendChild(elHTML('span','folder-dot',''));
      pill.appendChild(el('span',null, TF('folderConnected', { n: state.folderName })));
      folderRow.appendChild(pill);
      folderRow.appendChild(btn('btn-secondary btn-sm', T('folderSyncNow'), function(){ syncAllToFolder(false); }));
      folderRow.appendChild(btn('linkish', T('folderDisconnect'), function(){ disconnectFolder().then(renderFolderRow); }));
    } else if (fsDirHandle && !state.folderReady){
      var pill2 = el('div','folder-pill folder-warn');
      pill2.appendChild(elHTML('span','folder-dot',''));
      pill2.appendChild(el('span',null, TF('folderNeedsPerm', { n: state.folderName })));
      folderRow.appendChild(pill2);
      folderRow.appendChild(btn('btn-secondary btn-sm', T('folderReconnect'), function(){
        ensureFolderPermission().then(function(ok){ if (!ok) toast(T('folderPermDenied'), 'error'); else syncAllToFolder(false); renderFolderRow(); });
      }));
    } else {
      folderRow.appendChild(el('p','photo-hint', T('folderConnectDesc')));
      folderRow.appendChild(btn('btn-secondary btn-sm', T('folderConnect'), function(){
        connectFolder().then(function(ok){ renderFolderRow(); if (ok) syncAllToFolder(false); else if (!fsLastCanceled) toast(T('folderConnectFail'), 'error'); });
      }));
    }
  }
  renderFolderRow();
  card.appendChild(folderRow);

  // toolbar: search + Excel download / upload
  var bar = el('div','toolbar');
  var sw = el('div','search');
  sw.innerHTML = icon('search',18);
  var si = document.createElement('input');
  si.type = 'search'; si.className = 'input'; si.placeholder = T('searchPh'); si.value = state.search;
  si.setAttribute('aria-label', T('searchPh'));
  sw.appendChild(si);
  bar.appendChild(sw);

  var dl = el('button','btn btn-secondary btn-sm');
  dl.type = 'button'; dl.innerHTML = icon('download',18) + '<span></span>'; dl.lastChild.textContent = T('xlsDownload');
  dl.disabled = !state.registry.length;
  dl.onclick = exportXlsx;
  bar.appendChild(dl);

  var up = el('button','btn btn-secondary btn-sm');
  up.type = 'button'; up.innerHTML = icon('upload',18) + '<span></span>'; up.lastChild.textContent = T('xlsUpload');
  var fileIn = document.createElement('input');
  fileIn.type = 'file'; fileIn.hidden = true;
  fileIn.accept = '.xlsx,' + XL_MIME;
  fileIn.onchange = function(){
    var f = fileIn.files && fileIn.files[0];
    if (f) importXlsxFile(f);
    fileIn.value = '';
  };
  up.onclick = function(){ fileIn.click(); };
  bar.appendChild(up); bar.appendChild(fileIn);
  card.appendChild(bar);

  var holder = el('div');
  card.appendChild(holder);

  function fill(){
    holder.innerHTML = '';
    var q = state.search.trim().toLowerCase();
    var rows = state.registry.filter(function(r){
      var qd = q.replace(/\D/g,'');
      return !q || (fullName(r).toLowerCase().indexOf(q) >= 0) || (r.iin.indexOf(q) >= 0) || (qd.length >= 3 && (r.phone || '').replace(/\D/g,'').indexOf(qd) >= 0);
    });
    if (!rows.length){
      var em = el('div','empty');
      em.appendChild(elHTML('div','test-icon', icon(state.registry.length ? 'search' : 'users', 26)));
      if (state.registry.length){
        em.appendChild(el('p',null, T('noMatch')));
      } else {
        em.appendChild(el('h2',null, T('emptyTitle')));
        em.appendChild(el('p',null, T('emptyDesc')));
      }
      holder.appendChild(em);
      return;
    }
    var wrapT = el('div','table-wrap');
    var table = el('table','reg');
    var thead = document.createElement('thead'), htr = document.createElement('tr');
    ['colNo','colPatient','colIin','colPhone','colBirth','colReg','colResult','colDecision','colActions'].forEach(function(k){
      var th = document.createElement('th'); th.textContent = T(k); th.scope = 'col'; htr.appendChild(th);
    });
    thead.appendChild(htr); table.appendChild(thead);
    var tb = document.createElement('tbody');
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      function td(label, cls){ var c = document.createElement('td'); if (cls) c.className = cls; c.setAttribute('data-label', label); tr.appendChild(c); return c; }
      td(T('colNo'),'num').textContent = String(state.registry.indexOf(r) + 1);
      var c1 = td(T('colPatient'),'who-cell');
      c1.appendChild(el('span','who', fullName(r)));
      var c2 = td(T('colIin')); c2.className = 'mono'; c2.textContent = r.iin;
      var cph = td(T('colPhone')); cph.className = 'mono'; cph.textContent = r.phone || '—';
      var age = ageOf(r.birth);
      var c3 = td(T('colBirth')); c3.textContent = birthText(r.birth) + ' · ' + age + ' ' + T('ageYears');
      var reg = new Date(r.registeredAt);
      var c4 = td(T('colReg')); c4.textContent = fmtDMY(reg) + ', ' + fmtHMS(reg);
      var c5 = td(T('colResult'));
      if (r.result && r.result.risk) c5.appendChild(el('span','chip ' + riskClass(r.result.risk), riskLabel(r.result.risk)));
      else c5.appendChild(el('span','chip chip-none', T('notTested')));
      var cd = td(T('colDecision'));
      if (r.adminDecision) cd.textContent = T(r.adminDecision.status);
      else cd.appendChild(el('span','chip chip-none', T('decisionPending')));
      var c6 = td(T('colActions'),'act-cell');
      var acts = el('div','row-actions');
      var openBtn = btn('btn-secondary btn-sm', T('openRec'), function(){ adminOpenPatient(r); });
      openBtn.disabled = !(r.result && r.result.risk);
      acts.appendChild(openBtn);
      var del = el('button','icon-btn danger'); del.type = 'button';
      del.innerHTML = icon('trash',17);
      del.setAttribute('aria-label', T('delRec') + ': ' + fullName(r));
      del.onclick = function(){
        confirmDialog(TF('delConfirm', { n: fullName(r) }), T('yesDelete'), T('noKeep'), function(){ deleteRecord(r); });
      };
      acts.appendChild(del);
      c6.appendChild(acts);
      tb.appendChild(tr);
    });
    table.appendChild(tb); wrapT.appendChild(table); holder.appendChild(wrapT);
  }
  si.addEventListener('input', function(){ state.search = si.value; fill(); });
  fill();

  var foot = el('div','foot-row');
  foot.appendChild(el('p','note-small', T('privacyNote')));
  if (state.registry.length){
    var wipe = el('button','linkish', T('delAll')); wipe.type = 'button';
    wipe.style.color = 'var(--high)'; wipe.style.marginTop = '12px';
    wipe.onclick = function(){
      confirmDialog(TF('delAllConfirm', { n: state.registry.length }), T('yesDelete'), T('noKeep'), function(){
        state.registry = []; saveRegistry();
        state.patient = null; state.rightResult = null; state.leftResult = null;
        toast(T('deleted')); render();
      });
    };
    foot.appendChild(wipe);
  }
  card.appendChild(foot);

  screen.appendChild(card); wrap.appendChild(screen); app.appendChild(wrap);
}

/* ---------------- Boot ---------------- */
window.addEventListener('pagehide', function(){ stopStream(); stopCalLoop(); });
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (modalEl) closeModal();
  else if (assistant.open){ asSetOpen(false); if (assistant.fab) assistant.fab.focus(); }
});
state.registry = loadRegistry();
loadAdmins();
restoreSession();
if (!state.auth.role) state.flow = "role-select";
tryRestoreFolder().then(function(){ if (state.flow === "registry") render(); });
mountAssistant();
render();

})();
</script>
